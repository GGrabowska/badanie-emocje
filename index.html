<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Badanie: Emocje i pamięć</title>

  <!-- jsPsych i pluginy -->
  <script src="https://unpkg.com/jspsych@7.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert"></script>

  <link href="https://unpkg.com/jspsych@7.3.0/css/jspsych.css" rel="stylesheet">

<style>
body {
  margin: 0;
  font-size: 22px;
  line-height: 1.4;
}
  
html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden; 
  overflow-y: scroll;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  font-size: 20px;
  line-height: 1.4;
}

.jspsych-content-wrapper {
  height: 100vh; /* zamiast auto */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center; /* też dodaj */
}

.jspsych-content {
  max-width: 800px;
  width: 100%;
  padding: 40px 20px;
  text-align: center;
  margin: 0 auto;
  box-sizing: border-box;
  flex-grow: 1; 
}

/* 🔹 Metryczka — poprawne formatowanie pól */
.jspsych-survey-html-form label {
  display: block !important;
  margin-bottom: 18px !important;
}
.jspsych-survey-html-form input[type="number"],
.jspsych-survey-html-form input[type="text"] {
  width: 250px;
  padding: 6px 10px;
  font-size: 18px;
  margin-top: 4px;
}
.jspsych-survey-html-form input[type="radio"] {
  display: inline-block !important;
  margin: 6px 6px 6px 0 !important;
  transform: scale(1.2);
}

/* 🔹 Przyciski */
.jspsych-btn {
  font-size: 20px !important;
  padding: 10px 22px !important;
  margin-top: 30px !important;
  display: block !important;
  margin-left: auto !important;
  margin-right: auto !important;
}

/* 🔹 Poprawione skale Likert (PANAS + FAS) */
.jspsych-survey-likert-question {
  margin-bottom: 40px !important;
  text-align: left !important;
}

.jspsych-survey-likert-statement {
  margin-bottom: 12px;
  font-weight: 500;
}

.jspsych-survey-likert-opts {
  display: flex;
  justify-content: space-between;
  position: relative;
  width: 100%;
  max-width: 500px;
  margin: 0 auto 30px auto;
  padding: 0;
  list-style: none;
  background: #ccc;
  height: 2px;
}

.jspsych-survey-likert-opts li {
  position: relative;
  flex: 1;
  text-align: center;
  height: 50px; /* wysokość dla inputa + labelki */
}

.jspsych-survey-likert-opts input[type="radio"] {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%) scale(1.3);
  z-index: 2;
}

.jspsych-survey-likert-opts label {
  position: absolute;
  top: 22px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 16px;
  z-index: 2;
}

.jspsych-survey-likert-question {
  text-align: center !important;
}

.jspsych-survey-likert-opts {
  display: flex;
  justify-content: space-between;
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: 16px auto 40px auto;
  padding: 0;
  list-style: none;
  background: #ccc;
  height: 2px;
}
  
.jspsych-html-button-response-stimulus {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* Zmiana: każda próba zajmuje cały ekran */
#jspsych-target {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
  box-sizing: border-box;
}

.emoji-btn {
  font-size: 48px;
  cursor: grab;
  text-align: center;
  user-select: none;
  border: 2px solid transparent;
  border-radius: 8px;
  padding: 10px;
}

.emoji-btn:active {
  cursor: grabbing;
}

#grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  justify-items: center;
  max-width: 700px;
  width: 100%;
  margin: 30px auto 0 auto;
  box-sizing: border-box;
}

#slots {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 24px;
  margin: 30px auto 0 auto;
  max-width: 700px;
  width: 100%;
  box-sizing: border-box;
}

.drop-slot {
  width: 64px;
  height: 64px;
  font-size: 48px;
  border: 2px dashed #999;
  border-radius: 8px;
  text-align: center;
  line-height: 64px;
  background-color: #f9f9f9;
}

.slot-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.slot-number {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 4px;
}

#result {
  text-align: center;
  margin-top: 30px;
}

#finish {
  display: block;
  margin: 0 auto;
  margin-top: 20px;
  padding: 10px 24px;
  font-size: 18px;
}

body {
  overflow-x: hidden !important;
}

html.lock-scroll,
body.lock-scroll {
  overflow: hidden !important;
  height: 100vh !important;
  position: fixed !important;
  width: 100%;
}
  
.hide {
  display: none !important;
}

</style>

</head>
<body>
  <div id="jspsych-target"></div>
</body>

<script>
const jsPsych = initJsPsych({
  display_element: 'jspsych-target',
  on_finish: () => {
    fetch("https://script.google.com/macros/s/AKfycbw8ZgeZoanxg5NnTQH86WYmc01odFuhOB-BlrKpg-ucRLqLW3m9iHa3Np0phv9eWRlM/exec", {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: jsPsych.data.get().json()
    });
  }
});
  
const timeline = [];

const clear_screen = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: '',
  choices: "NO_KEYS",
  trial_duration: 200
};

/* 🔹 Zaproszenie */
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <p style="font-size:24px; text-align:center;">Cześć! 😊</p>
    <p style="text-align:center;">Zapraszam Cię do udziału w krótkim badaniu dotyczącym tego,
    jak bodźce emocjonalne w postaci emoji wpływają na pamięć krótkotrwałą.
    Udział zajmuje ok. <strong>15–20 min</strong> i jest całkowicie anonimowy.</p>
    <p style="text-align:center;">Twoje odpowiedzi są dla mnie bardzo ważne przy pisaniu pracy licencjackiej 💛</p>
  `,
  choices: ["Rozpocznij"],
  on_start: () => document.body.classList.add("lock-scroll"),
  on_finish: () => document.body.classList.remove("lock-scroll")

});

/* 🔹 Zgoda */
timeline.push({
  type: jsPsychSurveyHtmlForm,
  preamble: `<h2>Zgoda na udział w badaniu</h2>`,
  html: `
    <p>Szanowna Pani / Szanowny Panie,</p>

    <p>Nazywam się Gabriela Grabowska, jestem studentką kierunku psychologii i informatyki
    na Wydziale Projektowania Uniwersytetu SWPS w Warszawie. W ramach mojej pracy licencjackiej
    pt. <strong>„Wpływ emocji na pamięć krótkotrwałą”</strong>, realizuję badanie naukowe pod opieką
    dr Joanny Gutral-Sutherland.</p>

    <p>Celem badania jest sprawdzenie, w jaki sposób emocjonalny charakter bodźców wizualnych
    wpływa na funkcjonowanie pamięci krótkotrwałej. Badanie polega na wykonaniu serii zadań
    poznawczych: oceny emocji, rozpoznania bodźców oraz odtworzenia ich kolejności.</p>

    <p>Udział w badaniu zajmie około <strong>20 minut</strong>.</p>

    <p>Dane zebrane w trakcie badania są poufne, anonimowe i zostaną wykorzystane wyłącznie
    do celów naukowych. Uzyskane wyniki będą miały charakter zbiorczy, uniemożliwiający
    identyfikację poszczególnych uczestników.</p>

    <p>Udział w badaniu jest całkowicie dobrowolny. Ma Pan/Pani prawo do wycofania się z badania
    na każdym jego etapie bez podania przyczyny.</p>

    <p>W razie pytań proszę o kontakt: <strong>gabcia.grabowska@gmail.com</strong></p>

    <label style="font-size:18px; margin-top:16px;">
      <input type="checkbox" name="zgoda" required>
      ✔ Wyrażam zgodę na udział w badaniu
    </label>
  `,
  button_label: "Przechodzę dalej",
  data: { phase: "zgoda" },
  on_start: () => window.scrollTo(0, 0)
});

/* 🔹 Metryczka */
timeline.push({
  type: jsPsychSurveyHtmlForm,
  preamble: `<h2>Metryczka</h2>`,
  html: `
    <label>Wiek (wpisz liczbę):<br>
      <input type="number" name="wiek" min="10" max="100" required>
    </label>
    <br><br>

    <label>Płeć (zaznacz jedną odpowiedź):<br>
      <input type="radio" name="plec" value="Kobieta" required> Kobieta<br>
      <input type="radio" name="plec" value="Mężczyzna"> Mężczyzna<br>
      <input type="radio" name="plec" value="Inna"> Inna<br>
      <input type="radio" name="plec" value="Wolę nie podawać"> Wolę nie podawać
    </label>
    <br><br>

    <label>Wykształcenie (zaznacz najwyższy ukończony poziom):<br>
      <input type="radio" name="wykszt" value="Podstawowe" required> Podstawowe<br>
      <input type="radio" name="wykszt" value="Średnie"> Średnie<br>
      <input type="radio" name="wykszt" value="Wyższe licencjat/inżynier"> Wyższe (licencjat/inżynier)<br>
      <input type="radio" name="wykszt" value="Wyższe magister/wyżej"> Wyższe (magister lub wyższe)
    </label>
    <br><br>

    <label>
      Czy bierzesz udział w terapii psychologicznej lub psychiatrycznej?<br>
      <input type="radio" name="terapia" value="Tak" required> Tak<br>
      <input type="radio" name="terapia" value="Nie"> Nie<br>
      <input type="radio" name="terapia" value="Wolę nie podawać"> Wolę nie podawać
    </label>
  `,
  button_label: "Dalej",
  data: { phase: "metryczka" },
  on_start: () => window.scrollTo(0, 0),
  post_trial_gap: 500
});
  
timeline.push(clear_screen);
  
const INSTRUKCJA = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div style="max-width: 700px; margin: 0 auto; text-align: left;">
      <h2 style="text-align: center;">Instrukcja badania</h2>
      <p><strong>Etapy:</strong></p>
      <ol style="padding-left: 20px;">
        <li><strong>Kwestionariusz PANAS</strong> – ocena emocji</li>
        <li><strong>Kwestionariusz FAS</strong> – ocena zmęczenia</li>
        <li><strong>Zadanie próbne</strong> – test zapamiętywania emoji</li>
        <li><strong>Właściwe badanie</strong> – 3 rundy (pozytywne, neutralne, negatywne)</li>
      </ol>
      <p><strong>W każdej rundzie:</strong></p>
      <ul style="padding-left: 20px; list-style-type: disc;">
        <li>Zobaczysz 5 emoji – jedno co sekundę</li>
        <li>Potem siatkę 10 emoji – wybierasz znane i układasz je w kolejności</li>
      </ul>
      <p><strong>Nie musisz się spieszyć</strong> – liczy się poprawność i czas.</p>
    </div>
  `,
  choices: ["Rozumiem i zaczynam"],
  post_trial_gap: 500, 
  data: { phase: "instrukcja" },
  on_start: () => document.body.classList.add("lock-scroll"),
  on_finish: () => document.body.classList.remove("lock-scroll")

};

timeline.push(INSTRUKCJA);
timeline.push(clear_screen);
  
/* 🔹 PANAS */
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: `<h2>Kwestionariusz PANAS</h2>
    <p>Oceń, w jakim stopniu odczuwasz poniższe emocje w tej chwili.</p>`,
  questions: [
    { prompt: "Uważny/a", labels: ["1", "2", "3", "4", "5"], required: true },
    { prompt: "Entuzjastyczny/a", labels: ["1", "2", "3", "4", "5"], required: true },
    { prompt: "Przestraszony/a", labels: ["1", "2", "3", "4", "5"], required: true },
    { prompt: "Zawstydzony/a", labels: ["1", "2", "3", "4", "5"], required: true },
    { prompt: "Drażliwy/a", labels: ["1", "2", "3", "4", "5"], required: true },
    { prompt: "Zaniepokojony/a", labels: ["1", "2", "3", "4", "5"], required: true },
    { prompt: "Zlękniony/a", labels: ["1", "2", "3", "4", "5"], required: true },
    { prompt: "Nerwowy/a", labels: ["1", "2", "3", "4", "5"], required: true }
  ],
  scale_width: 500,
  button_label: "Dalej",
  data: { phase: "panas" },
  on_start: () => window.scrollTo(0, 0),
  post_trial_gap: 500
});
timeline.push(clear_screen);
  
/* 🔹 FAS */
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: `<h2>Kwestionariusz zmęczenia (FAS)</h2>
    <p>Oceń, jak często doświadczasz poniższych stanów w tej chwili.</p>`,
  questions: [
    "Cierpię z powodu zmęczenia.",
    "Męczę się bardzo szybko.",
    "Jestem mało aktywny/a.",
    "Mam dosyć energii.",
    "Fizycznie czuję się wyczerpany/a.",
    "Mam problem z rozpoczęciem czynności.",
    "Mam problem z jasnym myśleniem.",
    "Brakuje mi chęci do działania.",
    "Psychicznie czuję się wyczerpany/a.",
    "W trakcie czynności koncentruję się dobrze."
  ].map(q => ({
    prompt: q,
    labels: ["Nigdy", "Czasami", "Regularnie", "Często", "Zawsze"],
    required: true
  })),
  scale_width: 500,
  button_label: "Dalej",
  data: { phase: "zmeczenie_FAS" },
  on_start: () => window.scrollTo(0, 0),
  post_trial_gap: 500
});
timeline.push(clear_screen);

/* 🔹 Zadanie próbne — osobna strona z instrukcją */
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <h2 style="text-align:center;">Zadanie próbne</h2>
    <p style="text-align:center; max-width: 700px; margin: 0 auto;">
      W tym zadaniu przetestujesz sposób, w jaki będzie wyglądało właściwe badanie.
      Najpierw zobaczysz <strong>5 emotikonów</strong>, które będą pojawiać się <strong>jeden po drugim</strong>, po jednej sekundzie każdy.
      Spróbuj zapamiętać ich <strong>kolejność</strong>.
    </p>
    <p style="text-align:center; max-width: 700px; margin: 20px auto;">
      Następnie pojawi się <strong>siatka z 10 emotikonami</strong> (5 wcześniej pokazanych + 5 nowych).
      Twoim zadaniem będzie:
      <ol style="text-align:left; max-width: 700px; margin: 10px auto;">
        <li>Rozpoznać, które widziałeś/aś wcześniej</li>
        <li>Ułożyć je w <strong>właściwej kolejności</strong>, przeciągając je w odpowiednie pola</li>
      </ol>
      Nie spiesz się — najważniejsza jest poprawność.
    </p>
  `,
  choices: ["Rozpocznij zadanie próbne"],
  data: { phase: "instrukcja_probna" },
  on_start: () => document.body.classList.add("lock-scroll"),
  on_finish: () => document.body.classList.remove("lock-scroll"),
});
timeline.push(clear_screen);
  
// 🔹 Prezentacja emoji (próba)
timeline.push({
  timeline: [
    { 
      type: jsPsychHtmlKeyboardResponse, 
      stimulus: jsPsych.timelineVariable('stimulus'), 
      choices: "NO_KEYS", 
      trial_duration: 1000
    },
    { 
      type: jsPsychHtmlKeyboardResponse, 
      stimulus: "", 
      choices: "NO_KEYS", 
      trial_duration: 300
    }
  ],
  timeline_variables: ["🧃", "🍀", "🎧", "🚴", "🛹"].map(e => {
    return {
      stimulus: `<div style="font-size:70px; display:flex; justify-content:center; align-items:center; height:100%; width:100%; margin:0;">${e}</div>`
    };
  }),
  data: { phase: "probny_test_emoji" }
});

// 🔹 Przycisk „Pokaż siatkę emotek” po ostatniej emoji
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div style="max-width: 700px; margin: 0 auto; text-align: center;">
      <h3>Zapamiętałeś/aś kolejność?</h3>
      <p>Kliknij, aby przejść do siatki emoji i ułożyć je w kolejności.</p>
      <button id="go-next" class="jspsych-btn" style="margin-top: 40px; padding:14px 24px; font-size:20px;">
        Pokaż siatkę emotek
      </button>
    </div>
  `,
  choices: [], // ⬅️ wyłączamy domyślne przyciski
  on_load: () => {
    document.getElementById("go-next").addEventListener("click", () => {
      jsPsych.finishTrial();
    });
  }
});

// 🔹 Zadanie drag&drop po teście próbnym — WERSJA POPRAWIONA
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: () => {
    let html = `
      <div id="emoji-container" style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;">
        <div id="grid-interface" style="text-align: center;">
          <p style="margin-bottom: 16px;">Ułóż emotki we właściwej kolejności:</p>
          <button id="show-grid" style="padding:10px 20px; font-size:18px;">Pokaż siatkę emotek</button>
        </div>

        <div id="grid" class="hide" style="margin-top: 30px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; justify-items: center;">
    `;

    ["🧃", "🍀", "🎧", "🚴", "🛹", "🥑", "🎲", "🎨", "🧩", "📷"].forEach(e => {
      html += `<div class="emoji-btn" draggable="true">${e}</div>`;
    });

    html += `
        </div>
        <div id="slots" class="hide" style="margin-top: 30px; display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;">
    `;

    for (let i = 0; i < 5; i++) {
      html += `
        <div class="slot-wrapper">
          <span class="slot-number">${i + 1}</span>
          <div class="drop-slot"></div>
        </div>`;
    }

    html += `
        </div>
        <button id="finish" class="hide" style="margin-top: 20px;">Zakończ</button>
        <div id="result" style="margin-top: 20px;"></div>
      </div>
    `;
    return html;
  },
  choices: "NO_KEYS",
  on_load: () => {
    document.body.classList.add("lock-scroll");

    let drag = null;
    let startTime = null;

    const showGridBtn = document.getElementById("show-grid");
    const grid = document.getElementById("grid");
    const slots = document.getElementById("slots");
    const finishBtn = document.getElementById("finish");
    const resultBox = document.getElementById("result");

    showGridBtn.addEventListener("click", () => {
      document.getElementById("grid-interface").style.display = "none";
      grid.classList.remove("hide");
      slots.classList.remove("hide");
      finishBtn.classList.remove("hide");
      document.body.classList.remove("lock-scroll");
      startTime = performance.now();
    });

    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.addEventListener('dragstart', e => drag = e.target.textContent);
    });

    document.querySelectorAll('.drop-slot').forEach(slot => {
      slot.addEventListener('dragover', e => e.preventDefault());
      slot.addEventListener('drop', e => slot.textContent = drag);
    });

    finishBtn.addEventListener("click", () => {
      const rt = ((performance.now() - startTime) / 1000).toFixed(2);
      const answers = [];
      document.querySelectorAll(".drop-slot").forEach(slot => answers.push(slot.textContent));

      jsPsych.data.write({
        phase: "wyniki_probny_test",
        odpowiedzi: answers,
        czas_s: rt
      });

      resultBox.innerHTML = `
        <p>Twoje odpowiedzi zostały zapisane.<br>Czas: <strong>${rt} s</strong></p>
        <button id="next">Dalej</button>
      `;

      document.getElementById("next").addEventListener("click", () => {
        document.body.classList.remove("lock-scroll");
        document.getElementById("jspsych-target").innerHTML = "";
        jsPsych.finishTrial();
      });
    });
  }
});

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <h2>Teraz rozpocznie się badanie właściwe</h2>
    <p>Weź oddech i przygotuj się 🙂</p>
    <p>Pojawi się teraz pytanie o Twój aktualny nastrój.</p>`,
  choices: ["Rozpocznij badanie"],
  on_start: () => {
    document.body.classList.add("lock-scroll");
    window.scrollTo(0, 0); // ⬅️ to przenosimy tutaj
  },
  on_finish: () => document.body.classList.remove("lock-scroll"),
  data: { phase: "przejscie_do_glownego" },
  post_trial_gap: 500
});

const mood_question = {
  type: jsPsychSurveyLikert,
  preamble: `<h2>Ocena nastroju</h2><p>Jak aktualnie oceniasz swój nastrój?</p>`,
  questions: [
    {
      prompt: "Nastrój",
      labels: ["1 – bardzo zły", "2", "3", "4", "5 – bardzo dobry"],
      required: true
    }
  ],
  button_label: "Dalej"
};

timeline.push({
  ...mood_question,
  preamble: `<h2>Jak się aktualnie czujesz?</h2><p>Odpowiedz zanim rozpoczniesz pierwszą rundę badania.</p>`,
  data: { phase: "nastroj_przed_pozytywne" },
  on_start: () => document.body.classList.add("lock-scroll"),
  on_finish: () => document.body.classList.remove("lock-scroll")

});
timeline.push(clear_screen);
  
/* 🔹 Definicje trzech testów */
const tests = [
  { type: "pozytywne", msg: "pozytywnymi", seq: ["😄","😊","😂","🥰","😆"], grid: ["😄","😊","😂","🥰","😆","🤗","😋","😍","🙂","😃"] },
  { type: "neutralne", msg: "neutralnymi", seq: ["😐","🤔","😶","🙄","😑"], grid: ["😐","🤔","😶","🙄","😑","🧐","😬","😕","😒","😴"] },
  { type: "negatywne", msg: "negatywnymi", seq: ["😢","😠","😭","😩","😡"], grid: ["😢","😠","😭","😩","😡","😖","😞","😣","😤","😔"] }
];

tests.forEach(test => {

  // 1. Instrukcja dla konkretnego testu
  timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: `<h2>Teraz rozpoczniesz test z emotkami ${test.msg}.</h2>
      <p>Najpierw zobaczysz sekwencję 5 emoji — postaraj się zapamiętać ich kolejność.</p>`,
    choices: ["Zaczynam"]
  });
  timeline.push(clear_screen);
  
  // 2. Prezentacja emoji
  timeline.push({
    timeline: [
      { type: jsPsychHtmlKeyboardResponse, stimulus: jsPsych.timelineVariable('e'), choices: "NO_KEYS", trial_duration: 1000, on_start: () => document.body.classList.add("lock-scroll"), on_finish: () => document.body.classList.remove("lock-scroll") },
      { type: jsPsychHtmlKeyboardResponse, stimulus: "", choices: "NO_KEYS", trial_duration: 300, on_start: () => document.body.classList.add("lock-scroll"), on_finish: () => document.body.classList.remove("lock-scroll") }
    ],
    timeline_variables: test.seq.map(e => ({ e: `<div style="font-size:70px;">${e}</div>` })),
    data: { phase: `prezentacja_${test.type}` }
  });

  // 3. Drag&Drop
  timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: () => {
      let html = `<p>Ułóż emotki we właściwej kolejności:</p>
                  <button id="show-grid">Pokaż siatkę emotek</button>
                  <div id="grid" style="display:none;">`;
      test.grid.forEach(e => html += `<div class="emoji-btn" draggable="true">${e}</div>`);
      html += `</div><div id="slots" style="display:none;">`;
      for (let i = 0; i < 5; i++) {
        html += `<div class="slot-wrapper">
                   <span class="slot-number">${i + 1}</span>
                   <div class="drop-slot"></div>
                 </div>`;
      }
      html += `</div><button id="finish">Zakończ</button><div id="result"></div>`;
      return html;
    },
    choices: [],
    on_load: () => {
      let drag;
      document.querySelectorAll('.emoji-btn').forEach(btn =>
        btn.addEventListener('dragstart', e => drag = e.target.textContent)
      );

      document.getElementById("finish").style.display = "none";

      document.getElementById("show-grid").addEventListener("click", () => {
        document.getElementById("grid").style.display = "grid";
        document.getElementById("slots").style.display = "flex";
        document.getElementById("finish").style.display = "block";
        document.getElementById("show-grid").style.display = "none";

        startTime = performance.now();
      });

      document.querySelectorAll('.drop-slot').forEach(slot => {
        slot.addEventListener('dragover', e => e.preventDefault());
        slot.addEventListener('drop', e => slot.textContent = drag);
      });

      document.getElementById("finish").addEventListener("click", () => {
        const rt = ((performance.now() - startTime) / 1000).toFixed(2);
        const answers = [];
        let correct = 0;
        document.querySelectorAll(".drop-slot").forEach((slot,i) => {
          answers.push(slot.textContent);
          if (slot.textContent === test.seq[i]) correct++;
        });

        jsPsych.data.write({ phase:`wyniki_${test.type}`, odpowiedzi:answers, poprawne:correct, czas_s:rt });

        document.getElementById("result").innerHTML =
          `<p>Poprawnych miejsc: <strong>${correct}/5</strong><br>Czas: <strong>${rt} s</strong></p>
           <button id="next">Dalej</button>`;
       document.getElementById("next").onclick = () => {
         document.getElementById("jspsych-target").innerHTML = "";
         jsPsych.finishTrial();
};

      });
    }
  });

  // 4. Pytanie o nastrój po każdej rundzie
  timeline.push({
    ...mood_question,
    preamble: `<h2>Jak się czujesz po wykonaniu testu z emotkami ${test.msg}?</h2>`,
    data: { phase: `nastroj_po_${test.type}` },
    on_start: () => document.body.classList.add("lock-scroll"),
    on_finish: () => document.body.classList.remove("lock-scroll")
  });
  timeline.push(clear_screen);
});

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: function() {
    const total_correct = jsPsych.data.get().filter({ phase: /wyniki_/ }).select("poprawne").sum();
    const total_time = jsPsych.data.get().filter({ phase: /wyniki_/ }).select("czas_s").sum();
    return `<h2>Podsumowanie</h2>
            <p>Poprawnych odpowiedzi: ${total_correct} / 15</p>
            <p>Łączny czas: ${total_time.toFixed(2)} s</p>`;
  },
  choices: ["Zakończ badanie"],
  data: { phase: "podsumowanie" }
});

/* 🔹 Zakończenie */
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `<h2>Dziękujemy za udział w badaniu! 💛</h2><p>Twoje odpowiedzi zostały zapisane.</p>`,
  choices: ["Zakończ"],
  on_start: () => window.scrollTo(0, 0)
});
  
jsPsych.run(timeline);
</script>
</html>
