<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Badanie: Emocje i pamięć</title>

  <!-- jsPsych i pluginy -->
  <script src="https://unpkg.com/jspsych@7.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert"></script>

  <link href="https://unpkg.com/jspsych@7.3.0/css/jspsych.css" rel="stylesheet">

<style>
body {
  max-width: 900px;
  margin: 0 auto;
  font-size: 20px;
  line-height: 1.4;
}

/* Wyśrodkowanie ekranu */
.jspsych-content-wrapper {
  display: flex;
  justify-content: center;
}
.jspsych-content {
  max-width: 900px;
  margin: 0 auto !important;
  text-align: left !important;
  padding: 40px !important;
  zoom: 1.12; /* powiększenie wszystkiego */
}

/* 🔹 Metryczka — poprawne formatowanie pól */
.jspsych-survey-html-form label {
  display: block !important;
  margin-bottom: 18px !important;
}
.jspsych-survey-html-form input[type="number"],
.jspsych-survey-html-form input[type="text"] {
  width: 250px;
  padding: 6px 10px;
  font-size: 18px;
  margin-top: 4px;
}
.jspsych-survey-html-form input[type="radio"] {
  display: inline-block !important;
  margin: 6px 6px 6px 0 !important;
  transform: scale(1.2);
}

/* 🔹 Przyciski */
.jspsych-btn {
  font-size: 20px !important;
  padding: 10px 22px !important;
  margin-top: 30px !important;
  display: block !important;
  margin-left: auto !important;
  margin-right: auto !important;
}

/* 🔹 Poprawione skale Likert (PANAS + FAS) */
.jspsych-survey-likert-question {
  margin-bottom: 32px !important;
  text-align: left !important;
  align-items: flex-start !important;
}

.jspsych-survey-likert-prompt {
  font-size: 20px;
  font-weight: 500;
  margin-bottom: 8px;
}

.jspsych-survey-likert-opts {
  display: block !important;
  text-align: center;
  margin: 10px 0 30px 0;
  position: relative;
}

.jspsych-survey-likert-opts::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 8%;
  width: 84%;
  height: 2px;
  background-color: #ccc;
  z-index: 0;
}

.jspsych-survey-likert-opts li {
  display: inline-block;
  width: 10%;
  position: relative;
  z-index: 1;
}

.jspsych-survey-likert-opts li {
  list-style: none;
  text-align: center;
}

.jspsych-survey-likert-opts input[type="radio"] {
  transform: scale(1.2);
  margin-bottom: 4px;
}

.jspsych-survey-likert-opts label {
  font-size: 14px;
}

</style>

</head>
<body>
  <div id="jspsych-target"></div>
</body>

<script>
const jsPsych = initJsPsych({
  display_element: 'jspsych-target',
  on_finish: () => {
    fetch("https://script.google.com/macros/s/AKfycbw8ZgeZoanxg5NnTQH86WYmc01odFuhOB-BlrKpg-ucRLqLW3m9iHa3Np0phv9eWRlM/exec", {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: jsPsych.data.get().json()
    });
  }
});
  
const timeline = [];

/* 🔹 Zaproszenie */
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <p style="font-size:24px; text-align:center;">Cześć! 😊</p>
    <p style="text-align:center;">Zapraszam Cię do udziału w krótkim badaniu dotyczącym tego,
    jak bodźce emocjonalne w postaci emoji wpływają na pamięć krótkotrwałą.
    Udział zajmuje ok. <strong>15–20 min</strong> i jest całkowicie anonimowy.</p>
    <p style="text-align:center;">Twoje odpowiedzi są dla mnie bardzo ważne przy pisaniu pracy licencjackiej 💛</p>
  `,
  choices: ["Rozpocznij"]
});

/* 🔹 Zgoda */
timeline.push({
  type: jsPsychSurveyHtmlForm,
  preamble: `<h2>Zgoda na udział w badaniu</h2>`,
  html: `
    <p>Szanowna Pani / Szanowny Panie,</p>

    <p>Nazywam się Gabriela Grabowska, jestem studentką kierunku psychologii i informatyki
    na Wydziale Projektowania Uniwersytetu SWPS w Warszawie. W ramach mojej pracy licencjackiej
    pt. <strong>„Wpływ emocji na pamięć krótkotrwałą”</strong>, realizuję badanie naukowe pod opieką
    dr Joanny Gutral-Sutherland.</p>

    <p>Celem badania jest sprawdzenie, w jaki sposób emocjonalny charakter bodźców wizualnych
    wpływa na funkcjonowanie pamięci krótkotrwałej. Badanie polega na wykonaniu serii zadań
    poznawczych: oceny emocji, rozpoznania bodźców oraz odtworzenia ich kolejności.</p>

    <p>Udział w badaniu zajmie około <strong>20 minut</strong>.</p>

    <p>Dane zebrane w trakcie badania są poufne, anonimowe i zostaną wykorzystane wyłącznie
    do celów naukowych. Uzyskane wyniki będą miały charakter zbiorczy, uniemożliwiający
    identyfikację poszczególnych uczestników.</p>

    <p>Udział w badaniu jest całkowicie dobrowolny. Ma Pan/Pani prawo do wycofania się z badania
    na każdym jego etapie bez podania przyczyny.</p>

    <p>W razie pytań proszę o kontakt: <strong>gabcia.grabowska@gmail.com</strong></p>

    <label style="font-size:18px; margin-top:16px;">
      <input type="checkbox" name="zgoda" required>
      ✔ Wyrażam zgodę na udział w badaniu
    </label>
  `,
  button_label: "Przechodzę dalej",
  data: { phase: "zgoda" }
});

/* 🔹 Metryczka */
timeline.push({
  type: jsPsychSurveyHtmlForm,
  preamble: `<h2>Metryczka</h2>`,
  html: `
    <label>Wiek (wpisz liczbę):<br>
      <input type="number" name="wiek" min="10" max="100" required>
    </label>
    <br><br>

    <label>Płeć (zaznacz jedną odpowiedź):<br>
      <input type="radio" name="plec" value="Kobieta" required> Kobieta<br>
      <input type="radio" name="plec" value="Mężczyzna"> Mężczyzna<br>
      <input type="radio" name="plec" value="Inna"> Inna<br>
      <input type="radio" name="plec" value="Wolę nie podawać"> Wolę nie podawać
    </label>
    <br><br>

    <label>Wykształcenie (zaznacz najwyższy ukończony poziom):<br>
      <input type="radio" name="wykszt" value="Podstawowe" required> Podstawowe<br>
      <input type="radio" name="wykszt" value="Średnie"> Średnie<br>
      <input type="radio" name="wykszt" value="Wyższe licencjat/inżynier"> Wyższe (licencjat/inżynier)<br>
      <input type="radio" name="wykszt" value="Wyższe magister/wyżej"> Wyższe (magister lub wyższe)
    </label>
    <br><br>

    <label>
      Czy bierzesz udział w terapii psychologicznej lub psychiatrycznej?<br>
      <input type="radio" name="terapia" value="Tak" required> Tak<br>
      <input type="radio" name="terapia" value="Nie"> Nie<br>
      <input type="radio" name="terapia" value="Wolę nie podawać"> Wolę nie podawać
    </label>
  `,
  button_label: "Dalej",
  data: { phase: "metryczka" },
});
  
const INSTRUKCJA = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div style="max-width: 800px; margin: auto; text-align: left; padding: 40px;">
      <h2 style="text-align:center;">Instrukcja badania</h2>
      <p><strong>Etapy:</strong></p>
      <ol>
        <li>Kwestionariusz PANAS</li>
        <li>Kwestionariusz FAS</li>
        <li>Zadanie próbne</li>
        <li>Właściwe badanie (3 rundy: pozytywne, neutralne, negatywne)</li>
      </ol>
      <p>W każdej rundzie:</p>
      <ul>
        <li>Zobaczysz 5 emoji – jedno co sekundę</li>
        <li>Potem siatkę 10 emoji – wybierasz znane i układasz je w kolejności</li>
      </ul>
      <p>Nie musisz się spieszyć – ważna jest poprawność i czas.</p>
    </div>
  `,
  choices: ["Rozumiem i zaczynam"],
  data: { phase: "instrukcja" }
};


/* 🔹 PANAS */
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: `<h2>Kwestionariusz PANAS</h2>
    <p>Oceń, w jakim stopniu odczuwasz poniższe emocje w tej chwili.</p>`,
  questions: [
    { prompt: "Uważny/a", labels: ["1", "2", "3", "4", "5"], required: true },
    { prompt: "Entuzjastyczny/a", labels: ["1", "2", "3", "4", "5"], required: true },
    { prompt: "Przestraszony/a", labels: ["1", "2", "3", "4", "5"], required: true },
    { prompt: "Zawstydzony/a", labels: ["1", "2", "3", "4", "5"], required: true },
    { prompt: "Drażliwy/a", labels: ["1", "2", "3", "4", "5"], required: true },
    { prompt: "Zaniepokojony/a", labels: ["1", "2", "3", "4", "5"], required: true },
    { prompt: "Zlękniony/a", labels: ["1", "2", "3", "4", "5"], required: true },
    { prompt: "Nerwowy/a", labels: ["1", "2", "3", "4", "5"], required: true }
  ],
  scale_width: 500,
  button_label: "Dalej",
  data: { phase: "panas" }
});

/* 🔹 FAS */
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: `<h2>Kwestionariusz zmęczenia (FAS)</h2>
    <p>Oceń, jak często doświadczasz poniższych stanów w tej chwili.</p>`,
  questions: [
    "Cierpię z powodu zmęczenia.",
    "Męczę się bardzo szybko.",
    "Jestem mało aktywny/a.",
    "Mam dosyć energii.",
    "Fizycznie czuję się wyczerpany/a.",
    "Mam problem z rozpoczęciem czynności.",
    "Mam problem z jasnym myśleniem.",
    "Brakuje mi chęci do działania.",
    "Psychicznie czuję się wyczerpany/a.",
    "W trakcie czynności koncentruję się dobrze."
  ].map(q => ({
    prompt: q,
    labels: ["Nigdy", "Czasami", "Regularnie", "Często", "Zawsze"],
    required: true
  })),
  scale_width: 500,
  button_label: "Dalej",
  data: { phase: "zmeczenie_FAS" }
});


/* 🔹 Próbny test emoji */
const trialTest = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `<h2>Zaraz wykonasz zadanie próbne.</h2>
  <p>Zobaczysz 5 emoji – zapamiętaj ich kolejność.</p>`,
  choices: ["Zaczynam"]
};
timeline.push(trialTest);

timeline.push({
  timeline: [
    { type: jsPsychHtmlKeyboardResponse, stimulus: jsPsych.timelineVariable('e'), choices: "NO_KEYS", trial_duration: 1000 },
    { type: jsPsychHtmlKeyboardResponse, stimulus: "", choices: "NO_KEYS", trial_duration: 300 }
  ],
  timeline_variables: ["🧃", "🍀", "🎧", "🚴", "🛹"].map(e => ({ e: `<div style="font-size:70px;">${e}</div>` })),
  data: { phase: "probny_test_emoji" }
});

const mood_question = {
  type: jsPsychSurveyLikert,
  preamble: `<h2>Ocena nastroju</h2><p>Jak aktualnie oceniasz swój nastrój?</p>`,
  questions: [
    {
      prompt: "Nastrój",
      labels: ["1 – bardzo zły", "2", "3", "4", "5 – bardzo dobry"],
      required: true
    }
  ],
  button_label: "Dalej"
};

/* 🔹 Nastrój po próbnym teście */
timeline.push({
  type: jsPsychSurveyLikert,
  preamble: `<h2>Jak aktualnie się czujesz?</h2>`,
  questions: [{
    prompt: "Nastrój",
    labels: ["1 – bardzo zły", "2", "3", "4", "5 – bardzo dobry"],
    required: true
  }],
  button_label: "Dalej",
  data: { phase: "nastroj_po_probnym" }
});

/* 🔹 Definicje trzech testów */
const tests = [
  { type: "pozytywne", msg: "pozytywnymi", seq: ["😄","😊","😂","🥰","😆"], grid: ["😄","😊","😂","🥰","😆","🤗","😋","😍","🙂","😃"] },
  { type: "neutralne", msg: "neutralnymi", seq: ["😐","🤔","😶","🙄","😑"], grid: ["😐","🤔","😶","🙄","😑","🧐","😬","😕","😒","😴"] },
  { type: "negatywne", msg: "negatywnymi", seq: ["😢","😠","😭","😩","😡"], grid: ["😢","😠","😭","😩","😡","😖","😞","😣","😤","😔"] }
];

let startTime;

/* 🔹 Generowanie 3 testów emotek */
tests.forEach(test => {

timeline.push({ 
  ...mood_question, 
  data: { phase: `nastroj_po_${test.type}` } 
});

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `<h2>Teraz rozpoczniesz test z emotkami ${test.msg}.</h2>
  <p>Najpierw zobaczysz sekwencję 5 emoji — postaraj się zapamiętać ich kolejność.</p>`,
  choices: ["Zaczynam"]
});



  timeline.push({
    timeline: [
      { type: jsPsychHtmlKeyboardResponse, stimulus: jsPsych.timelineVariable('e'), choices: "NO_KEYS", trial_duration: 1000 },
      { type: jsPsychHtmlKeyboardResponse, stimulus: "", choices: "NO_KEYS", trial_duration: 300 }
    ],
    timeline_variables: test.seq.map(e => ({ e: `<div style="font-size:70px;">${e}</div>` })),
    data: { phase: `prezentacja_${test.type}` }
  });

  timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: () => {
      let html = `<p>Ułóż emotki we właściwej kolejności:</p><div id="grid">`;
      test.grid.forEach(e => html += `<div class="emoji-btn" draggable="true">${e}</div>`);
      html += `</div><div id="slots">`;
      for (let i = 0; i < 5; i++) html += `<div class="drop-slot"></div>`;
      html += `</div><button id="finish">Zakończ</button><div id="result"></div>`;
      return html;
    },
    choices: [],
    on_load: () => {
      let drag;
      document.querySelectorAll('.emoji-btn').forEach(btn =>
        btn.addEventListener('dragstart', e => drag = e.target.textContent)
      );
      document.querySelectorAll('.drop-slot').forEach(slot => {
        slot.addEventListener('dragover', e => e.preventDefault());
        slot.addEventListener('drop', e => slot.textContent = drag);
      });

      startTime = performance.now();
      document.getElementById("finish").addEventListener("click", () => {
        const rt = ((performance.now() - startTime) / 1000).toFixed(2);
        const answers = [];
        let correct = 0;
        document.querySelectorAll(".drop-slot").forEach((slot,i) => {
          answers.push(slot.textContent);
          if (slot.textContent === test.seq[i]) correct++;
        });

        jsPsych.data.write({ phase:`wyniki_${test.type}`, odpowiedzi:answers, poprawne:correct, czas_s:rt });

        document.getElementById("result").innerHTML =
          `<p>Poprawnych miejsc: <strong>${correct}/5</strong><br>Czas: <strong>${rt} s</strong></p>
           <button id="next">Dalej</button>`;
        document.getElementById("next").onclick = () => jsPsych.finishTrial();
      });
    }
  });

  timeline.push({ ...mood_question, data: { phase: `nastroj_po_${test.type}` } });

});

/* 🔹 Zakończenie */
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `<h2>Dziękujemy za udział w badaniu! 💛</h2><p>Twoje odpowiedzi zostały zapisane.</p>`,
  choices: ["Zakończ"]
});

jsPsych.run(timeline);
</script>
</html>
