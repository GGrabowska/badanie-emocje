<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Badanie: Emocje i pamięć</title>

  <!-- jsPsych -->
  <script src="https://unpkg.com/jspsych@7.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response"></script>
  <link href="https://unpkg.com/jspsych@7.3.0/css/jspsych.css" rel="stylesheet" />

  <style>
    body { background: white; }
    .emoji-btn { font-size: 48px; cursor: move; user-select: none; padding: 10px; border: 1px solid #ccc; margin: 5px; display: inline-block; }
    .drop-slot { width: 60px; height: 60px; font-size: 40px; border: 2px dashed #aaa; display: inline-flex; justify-content: center; align-items: center; margin: 5px; }
    #result { font-weight: bold; text-align: center; margin-top: 20px; }
  </style>
</head>

<body></body>

<script>
/* Inicjacja jsPsych – TAK MA BYĆ, BEZ onFinish */
const jsPsych = initJsPsych({
  on_finish: () => {
    fetch("https://script.google.com/macros/s/AKfycbw8ZgeZoanxg5NnTQH86WYmc01odFuhOB-BlrKpg-ucRLqLW3m9iHa3Np0phv9eWRlM/exec", {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: jsPsych.data.get().json()
    });
  }
});

/* Timeline badania */
const timeline = [];

/* Ekran powitalny */
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `<h2>Zaproszenie do badania</h2>
  <p>Badanie dotyczy emocji i pamięci krótkotrwałej.</p>
  <p>Zajmie około 15–20 minut.</p>`,
  choices: ["Zaczynam"]
});

/* Tu będziemy stopniowo dodawać kolejne elementy badania */
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `<h2>Koniec testowej wersji</h2>
  <p>Jeśli to okno się wyświetla — badanie działa poprawnie.</p>`,
  choices: ["Zakończ"]
});

/* Start */
jsPsych.run(timeline);
</script>
</html>
