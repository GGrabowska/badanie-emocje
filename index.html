<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Badanie: Emocje i pamięć</title>

  <!-- jsPsych -->
  <script src="https://unpkg.com/jspsych@7.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response"></script>
  <link href="https://unpkg.com/jspsych@7.3.0/css/jspsych.css" rel="stylesheet" />

  <style>
    body { background: white; }
    .emoji-btn { font-size: 48px; cursor: move; user-select: none; padding: 10px; border: 1px solid #ccc; margin: 5px; display: inline-block; }
    .drop-slot { width: 60px; height: 60px; font-size: 40px; border: 2px dashed #aaa; display: inline-flex; justify-content: center; align-items: center; margin: 5px; }
    #result { font-weight: bold; text-align: center; margin-top: 20px; }
  </style>
</head>

<body></body>

<script>
/* Inicjacja jsPsych – TAK MA BYĆ, BEZ onFinish */
const jsPsych = initJsPsych({
  on_finish: () => {
    fetch("https://script.google.com/macros/s/AKfycbw8ZgeZoanxg5NnTQH86WYmc01odFuhOB-BlrKpg-ucRLqLW3m9iHa3Np0phv9eWRlM/exec", {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: jsPsych.data.get().json()
    });
  }
});

/* Timeline badania */
const timeline = [];

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <h2>Zaproszenie do badania</h2>
    <p>Badanie dotyczy emocji i pamięci krótkotrwałej.</p>
    <p>Zajmie około 15–20 minut.</p>
  `,
  choices: ["Zaczynam"],
  button_label: "Zaczynam",
  data: { phase: "intro" }
});


/* 2) Zgoda na udział w badaniu */
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <h2>Zgoda na udział w badaniu</h2>

    <p>Szanowna Pani / Szanowny Panie,</p>
    <p>Nazywam się Gabriela Grabowska, jestem studentką kierunku psychologii i informatyki 
    na Wydziale Projektowania Uniwersytetu SWPS w Warszawie. 
    W ramach mojej pracy licencjackiej pt. <strong>„Wpływ emocji na pamięć krótkotrwałą”</strong>, 
    realizuję badanie naukowe pod opieką dr Joanny Gutral-Sutherland.</p>

    <p>Celem badania jest sprawdzenie, w jaki sposób emocjonalny charakter bodźców wizualnych 
    wpływa na funkcjonowanie pamięci krótkotrwałej. Badanie polega na wykonaniu serii zadań poznawczych: 
    oceny emocji, rozpoznania bodźców oraz odtworzenia ich kolejności.</p>

    <p>Udział w badaniu zajmie około <strong>20 minut</strong>.</p>

    <p>Dane zebrane w trakcie badania są poufne, anonimowe i zostaną wykorzystane wyłącznie do celów naukowych. 
    Wyniki będą miały charakter zbiorczy, uniemożliwiający identyfikację poszczególnych uczestników.</p>

    <p>Udział w badaniu jest całkowicie dobrowolny. Ma Pan/Pani prawo wycofać się z badania 
    na każdym jego etapie bez podania przyczyny — bez żadnych konsekwencji.</p>

    <p>W razie pytań proszę o kontakt:<br>
    <strong>gabcia.grabowska@gmail.com</strong></p>

    <p style="margin-top:25px; font-size:16px;">
    Klikając przycisk poniżej, potwierdzam, że:<br>
    • zapoznałem/-am się z powyższymi informacjami,<br>
    • rozumiem cel i przebieg badania,<br>
    • wiem, że udział jest dobrowolny i mogę zrezygnować w dowolnym momencie.
    </p>
  `,
  choices: ["Wyrażam zgodę na udział w badaniu"],
  data: { phase: "zgoda" }
});

  
/* Tu będziemy stopniowo dodawać kolejne elementy badania */
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `<h2>Koniec testowej wersji</h2>
  <p>Jeśli to okno się wyświetla — badanie działa poprawnie.</p>`,
  choices: ["Zakończ"]
});

/* Start */
jsPsych.run(timeline);
</script>
</html>
